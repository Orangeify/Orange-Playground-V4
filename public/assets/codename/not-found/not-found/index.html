<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 - Orange Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Boldonse&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/codename/not-found/not-found/not-found.css" />
  </head>
  <body>
    <main class="not-found-layout">
      <section class="not-found-game-side" aria-label="Play Tetris">
        <div class="tetris-layout">
          <aside class="tetris-hud">
            <div class="tetris-hud-label">HOLD</div>
            <div
              class="tetris-hold-box"
              id="hold-box"
              aria-label="No held piece"
            ></div>
            <div class="tetris-stat">
              <span>LEVEL</span>
              <strong id="level-value">1</strong>
            </div>
            <div class="tetris-stat">
              <span>SCORE</span>
              <strong id="score-value">0</strong>
            </div>
          </aside>

          <div class="tetris-board-wrap" aria-label="Tetris playfield">
            <div
              class="tetris-board"
              id="tetris-board"
              role="grid"
              aria-label="10 by 20 Tetris board"
            ></div>
            <div class="tetris-board-overlay" id="status-overlay" aria-live="polite">
              <span class="tetris-start-prompt" id="status-text">PRESS ENTER TO PLAY</span>
            </div>
          </div>

          <aside class="tetris-next" aria-label="Next pieces">
            <div class="tetris-hud-label">NEXT</div>
            <div class="tetris-next-list" id="next-list"></div>
          </aside>
        </div>
      </section>

      <section class="not-found-message-side">
        <div class="not-found-copy">
          <h1>404</h1>
          <p id="not-found-message"></p>
          <hr>
          <p1>Still getting this error? Try one of these.</p1>
          <div class="buttons-to-click">
            <button>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house preview-icon"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                <path
                  d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                ></path>
              </svg>
              <p>Go Back Home</p>
            </button>
            <button>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-discord" viewBox="0 0 16 16">
                <path d="M13.545 2.907a13.2 13.2 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.2 12.2 0 0 0-3.658 0 8 8 0 0 0-.412-.833.05.05 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.04.04 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032q.003.022.021.037a13.3 13.3 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019q.463-.63.818-1.329a.05.05 0 0 0-.01-.059l-.018-.011a9 9 0 0 1-1.248-.595.05.05 0 0 1-.02-.066l.015-.019q.127-.095.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.05.05 0 0 1 .053.007q.121.1.248.195a.05.05 0 0 1-.004.085 8 8 0 0 1-1.249.594.05.05 0 0 0-.03.03.05.05 0 0 0 .003.041c.24.465.515.909.817 1.329a.05.05 0 0 0 .056.019 13.2 13.2 0 0 0 4.001-2.02.05.05 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.03.03 0 0 0-.02-.019m-8.198 7.307c-.789 0-1.438-.724-1.438-1.612s.637-1.613 1.438-1.613c.807 0 1.45.73 1.438 1.613 0 .888-.637 1.612-1.438 1.612m5.316 0c-.788 0-1.438-.724-1.438-1.612s.637-1.613 1.438-1.613c.807 0 1.451.73 1.438 1.613 0 .888-.631 1.612-1.438 1.612"/>
              </svg>
              <p>Join the Discord Server (NOT PROXIED)</p>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/assets/codename/not-found/not-found/not-found-static.js"></script>
  </body>
</html>
